[env:lhc-badge-2025]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = LHC_BADGE_2025
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LHC Badge 2025
custom_meshtastic_tags = LHC
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board = lhc-badge-2025
board_level = extra
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool

# Keep the qio_opi FreeRTOS library ABI aligned with its framework headers.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_FREERTOS_USE_TRACE_FACILITY=y

# Work around pioarduino linker failures with software atomic helpers.
build_unflags =
  ${esp32s3_base.build_unflags}
  -mdisable-hardware-atomics

build_flags =
  ${esp32s3_base.build_flags}
  -D LHC_BADGE_2025
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/lhc-badge-2025
